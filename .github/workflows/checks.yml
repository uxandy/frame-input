name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Installer regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell syntax
        run: |
          bash -n frame/control.sh
          bash -n frame/install-shortcuts.sh
      - name: Source package and manifest
        run: |
          python3 package.py
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          prefix = f'frame-input-{version}'
          with zipfile.ZipFile(f'dist/{prefix}.zip') as archive:
              assert archive.testzip() is None
              manifest = json.loads(archive.read(f'{prefix}/MANIFEST.json'))
              assert manifest['version'] == version
              assert set(archive.namelist()) == {f'{prefix}/{name}' for name in manifest['sha256']} | {f'{prefix}/MANIFEST.json'}
              for name, expected in manifest['sha256'].items():
                  assert hashlib.sha256(archive.read(f'{prefix}/{name}')).hexdigest() == expected, name
          print('Package integrity verified')
          PY
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test_windows.ps1
      - name: PowerShell 7
        shell: pwsh
        run: .\tests\test_windows.ps1
